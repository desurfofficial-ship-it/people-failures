<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Famous Failures — Grokipedia Board</title>
  <meta name="description" content="Kanban board of famous failures. Click any card for the full story, how to apply it, and a book.">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <header class="board-header">
    <div class="header-left">
      <div class="logo">
        <span class="logo-g">G</span>
        <div class="logo-text">
          <span class="logo-main">Grokipedia</span>
          <span class="logo-sub">Failures Board</span>
        </div>
      </div>
    </div>
    <div class="header-center">
      <input type="search" id="search" placeholder="Filter cards..." aria-label="Filter cards">
    </div>
    <div class="header-right">
      <span class="meta">Click a card for the full playbook</span>
    </div>
  </header>

  <div class="board-intro">
    <p>Setbacks before the wins. Click any card → story, how to apply it, when it fits, resources, takeaway, and a book.</p>
  </div>

  <div class="board" id="board"></div>

  <footer class="board-footer">
    <p>Grokipedia / Failures — unofficial community board</p>
    <p><a href="https://github.com/desurfofficial-ship-it/people-failures">GitHub</a></p>
  </footer>

  <!-- Detail modal -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" aria-label="Close">×</button>
      <div class="modal-header">
        <div class="modal-avatar" id="modal-avatar"></div>
        <div>
          <p class="modal-cat" id="modal-cat"></p>
          <h2 id="modal-title"></h2>
          <p class="modal-fail" id="modal-fail"></p>
        </div>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
